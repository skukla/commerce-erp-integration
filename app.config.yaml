# Two extension points: the App Management app (events, webhooks, install) and the
# Commerce Admin screen. Both are generated from app.commerce.config.ts by
# @adobe/aio-commerce-lib-app's pre-app-build hooks.
extensions:
  # This extension is required for app management. Do not remove.
  commerce/extensibility/1:
    $include: src/commerce-extensibility-1/ext.config.yaml
  commerce/backend-ui/2:
    $include: src/commerce-backend-ui-2/ext.config.yaml

productDependencies:
  - code: COMMC
    minVersion: 2.4.4
    maxVersion: 2.4.9
