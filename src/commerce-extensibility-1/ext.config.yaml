# The [pre-app-build] hooks are auto-generated. Do not remove or manually edit.
hooks:
  pre-app-build: EXTENSION=extensibility/1 npx aio-commerce-lib-app hooks pre-app-build
  post-app-deploy: EXTENSION=extensibility/1 npx aio-commerce-lib-app hooks post-app-deploy

operations:
  # These worker processes definitions are auto-generated. Do not remove or manually edit.
  workerProcess:
    - type: action
      impl: app-management/app-config
    - type: action
      impl: app-management/association
    - type: action
      impl: app-management/installation

runtimeManifest:
  packages:
    starter-kit:
      license: Apache-2.0
      actions:
        $include: ./actions/starter-kit/actions.config.yaml
    product-commerce:
      license: Apache-2.0
      actions:
        $include: ./actions/product/commerce/actions.config.yaml
    stock-commerce:
      license: Apache-2.0
      actions:
        $include: ./actions/stock/commerce/actions.config.yaml
    order-commerce:
      license: Apache-2.0
      actions:
        $include: ./actions/order/commerce/actions.config.yaml
    ingestion:
      license: Apache-2.0
      actions:
        $include: ./actions/ingestion/actions.config.yaml
    product-backoffice:
      license: Apache-2.0
      actions:
        $include: ./actions/product/external/actions.config.yaml
    stock-backoffice:
      license: Apache-2.0
      actions:
        $include: ./actions/stock/external/actions.config.yaml
    order-backoffice:
      license: Apache-2.0
      actions:
        $include: ./actions/order/external/actions.config.yaml
    company-commerce:
      license: Apache-2.0
      actions:
        $include: ./actions/company/commerce/actions.config.yaml
    company-backoffice:
      license: Apache-2.0
      actions:
        $include: ./actions/company/external/actions.config.yaml
    erp:
      license: Apache-2.0
      actions:
        $include: ./actions/erp/actions.config.yaml
      # The ERP raises no event when a price line's start or end date arrives, so every ERP's
      # prices in force are published again every hour, at five past (erp/prices-scheduled).
      # Hourly, not daily: I/O Runtime evaluates cron in UTC only and ignores any timezone
      # (developer.adobe.com/app-builder/docs/resources/cron-jobs/lesson3), so one daily run
      # lands a dated price hours away from its day somewhere; hourly makes it take effect
      # within the hour. The publish is a replace that writes only changes. The alarm feed
      # with a cron schedule: /whisk.system/alarms/alarm. No maxTriggers: it would stop the
      # schedule after that many runs.
      triggers:
        erp-prices-hourly-timer:
          feed: /whisk.system/alarms/alarm
          inputs:
            cron: "5 * * * *"
      rules:
        erp-prices-hourly-on-timer:
          trigger: erp-prices-hourly-timer
          action: prices-scheduled

    # This package definition is auto-generated. Do not remove or manually edit.
    app-management:
      license: Apache-2.0
      actions:
        app-config:
          function: .generated/actions/app-management/app-config.js
          web: yes
          runtime: nodejs:24
          inputs:
            LOG_LEVEL: $LOG_LEVEL
          annotations:
            final: true
            require-adobe-auth: true
        association:
          function: .generated/actions/app-management/association.js
          web: yes
          runtime: nodejs:24
          inputs:
            LOG_LEVEL: $LOG_LEVEL
          annotations:
            final: true
            require-adobe-auth: true
        installation:
          function: .generated/actions/app-management/installation.js
          web: yes
          runtime: nodejs:24
          inputs:
            LOG_LEVEL: $LOG_LEVEL
            AIO_COMMERCE_AUTH_IMS_CLIENT_ID: $AIO_COMMERCE_AUTH_IMS_CLIENT_ID
            AIO_COMMERCE_AUTH_IMS_CLIENT_SECRETS: $AIO_COMMERCE_AUTH_IMS_CLIENT_SECRETS
            AIO_COMMERCE_AUTH_IMS_TECHNICAL_ACCOUNT_ID: $AIO_COMMERCE_AUTH_IMS_TECHNICAL_ACCOUNT_ID
            AIO_COMMERCE_AUTH_IMS_TECHNICAL_ACCOUNT_EMAIL: $AIO_COMMERCE_AUTH_IMS_TECHNICAL_ACCOUNT_EMAIL
            AIO_COMMERCE_AUTH_IMS_ORG_ID: $AIO_COMMERCE_AUTH_IMS_ORG_ID
            AIO_COMMERCE_AUTH_IMS_SCOPES: $AIO_COMMERCE_AUTH_IMS_SCOPES
          annotations:
            final: true
            require-adobe-auth: true
          limits:
            timeout: 600000
