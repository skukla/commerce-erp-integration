# The Commerce Admin screen (Admin UI SDK, extension point commerce/backend-ui/2).
# Regenerated by @adobe/aio-commerce-lib-app from the adminUi section of
# app.commerce.config.ts; the web-src/ page is ours.
hooks:
  pre-app-build: EXTENSION=backend-ui/2 npx aio-commerce-lib-app hooks pre-app-build
  # The CLI bundles web assets in Parcel's development mode (JSX compiled to jsxDEV) while
  # the pre-app-build hook above pins NODE_ENV=production, which selects React's production
  # runtime that has no jsxDEV: a blank page. Building here, in production mode, keeps the two
  # in step whatever flags the deploy is run with.
  build-static: npm run build:admin-ui
  pre-app-dev: EXTENSION=backend-ui/2 npx aio-commerce-lib-app hooks pre-app-dev
  pre-app-run: EXTENSION=backend-ui/2 npx aio-commerce-lib-app hooks pre-app-run

operations:
  view:
    - type: web
      impl: index.html
  # These worker processes definitions are auto-generated. Do not remove or manually edit.
  workerProcess:
    - type: action
      impl: erp/order-grid

web: web-src
