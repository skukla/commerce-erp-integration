<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <title>ERP Integration · Activity</title>
    <link href="https://fonts.googleapis.com" rel="preconnect">
    <link crossorigin href="https://fonts.gstatic.com" rel="preconnect">
    <link
      href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap"
      rel="stylesheet"
    >
    <link href="mockups.css" rel="stylesheet">
  </head>
  <body data-page="activity">
    <template id="band-actions">
      <span class="band-note"
        >Next price update <strong>3:05 PM</strong> · last ran 2:05 PM, no
        changes</span
      >
      <button class="btn btn-secondary" type="button">Refresh</button>
    </template>

    <main class="page">
      <div class="feed-tools">
        <div aria-label="Filter activity" class="filters" role="toolbar">
          <div class="filter-group">
            <span>ERP</span>
            <button
              aria-pressed="true"
              class="filter-chip"
              data-group="erp"
              data-value="all"
              type="button"
            >
              All
            </button>
            <button
              aria-pressed="false"
              class="filter-chip northwind"
              data-group="erp"
              data-value="northwind"
              type="button"
            >
              Northwind
            </button>
            <button
              aria-pressed="false"
              class="filter-chip contoso"
              data-group="erp"
              data-value="contoso"
              type="button"
            >
              Contoso
            </button>
          </div>
          <div class="filter-group">
            <span>Type</span>
            <button
              aria-pressed="true"
              class="filter-chip"
              data-group="type"
              data-value="all"
              type="button"
            >
              All
            </button>
            <button
              aria-pressed="false"
              class="filter-chip"
              data-group="type"
              data-value="order"
              type="button"
            >
              Order
            </button>
            <button
              aria-pressed="false"
              class="filter-chip"
              data-group="type"
              data-value="price"
              type="button"
            >
              Price
            </button>
            <button
              aria-pressed="false"
              class="filter-chip"
              data-group="type"
              data-value="stock"
              type="button"
            >
              Stock
            </button>
            <button
              aria-pressed="false"
              class="filter-chip"
              data-group="type"
              data-value="credit"
              type="button"
            >
              Credit
            </button>
            <button
              aria-pressed="false"
              class="filter-chip"
              data-group="type"
              data-value="reset"
              type="button"
            >
              Demo reset
            </button>
          </div>
          <button
            aria-pressed="false"
            class="filter-chip problems"
            data-group="problems"
            type="button"
          >
            Problems only
          </button>
        </div>
      </div>
